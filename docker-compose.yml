services:
  university-homework:
    build: .
    image: university-homework:latest
    container_name: university-homework
    restart: unless-stopped
    ports:
      - "34567:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      JWT_SECRET: ${JWT_SECRET:?请在.env中设置JWT_SECRET}
      PORT: 3000
      UPLOAD_MAX_MB: 200
      TZ: Asia/Shanghai
