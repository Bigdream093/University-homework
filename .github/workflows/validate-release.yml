name: Release validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CSP_MODE: enforce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:runtime
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t university-homework:verified .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            test-results/browser-source-report/
            test-results/browser-source/
          retention-days: 7
