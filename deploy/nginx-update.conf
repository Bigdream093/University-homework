# Merge into the existing HTTP server block; do not replace business routes.
# Mount the NAS update directory at /usr/share/nginx/electron_update:ro.
location ^~ /update/ {
    alias /usr/share/nginx/electron_update/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    limit_except GET HEAD { deny all; }
}
