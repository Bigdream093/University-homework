server {
    listen 80;
    server_name _;
    server_tokens off;

    # Keep the existing application's per-file limits and streaming behavior.
    client_max_body_size 0;
    client_body_timeout 7200s;
    send_timeout 7200s;

    location ^~ /update/ {
        alias /usr/share/nginx/electron_update/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location / {
        proxy_pass http://university-homework:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx is the single trusted hop; discard client-supplied headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
}
