services:
  university-homework:
    image: university-homework:1.6.9
    pull_policy: never
    container_name: university-homework
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${UPLOAD_DIR:-./uploads}
        target: /app/uploads
        bind:
          create_host_path: false
    environment:
      JWT_SECRET: ${JWT_SECRET:?请保留原.env中的JWT_SECRET}
      PORT: 3000
      UPLOAD_MAX_MB: 200
      MATERIAL_UPLOAD_MAX_MB: 10240
      UPLOAD_REQUEST_TIMEOUT_MS: 7200000
      TRUST_PROXY_HOPS: 1
      CSP_MODE: enforce
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  nginx:
    image: nginx:mohen-1.6.6
    pull_policy: never
    container_name: university-homework-nginx
    restart: unless-stopped
    depends_on:
      university-homework:
        condition: service_healthy
    ports:
      - "${APP_PORT:-34567}:80"
    # NAS shared folders may omit the read/execute permissions nginx needs.
    # Fix only the mounted update files on each container start, then launch nginx normally.
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        chmod -R a+rX /usr/share/nginx/electron_update &&
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./update
        target: /usr/share/nginx/electron_update
        bind:
          create_host_path: false
